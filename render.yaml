# render.yaml — Render.com Blueprint
# https://docs.render.com/blueprint-spec

services:
  - type: worker
    name: telegram-userbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    secretFiles:
      - key: session.txt
        filePath: /etc/secrets/session.txt
